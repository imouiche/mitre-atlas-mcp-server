name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-extras --dev

      - name: Test
        run: uv run pytest -q

      - name: Check manifest versions agree
        run: uv run python scripts/sync_version.py --check

      - name: Server starts and registers its tools
        run: uv run python scripts/smoke_test.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Wheel contains the vendored dataset
        run: |
          python -c "
          import zipfile, glob, sys
          wheel = glob.glob('dist/*.whl')[0]
          names = zipfile.ZipFile(wheel).namelist()
          needed = [
              'mitre_atlas_mcp/data/atlas/ATLAS.yaml',
              'mitre_atlas_mcp/data/atlas/RELEASE',
          ]
          missing = [n for n in needed if n not in names]
          if missing:
              sys.exit(f'wheel is missing {missing}')
          print(f'{wheel}: dataset present, {len(names)} entries')
          "

      - name: Install the built wheel clean and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/*.whl
          /tmp/clean/bin/python -c "
          from mitre_atlas_mcp.tools.reference import get_atlas_info
          info = get_atlas_info()
          assert info['techniques'] == 221, info
          print('installed wheel serves ATLAS', info['atlas_release'])
          "

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5

      # Pack, extract and run from the tarball rather than the source tree.
      # files[] enumerates the vendored data explicitly, so a new data
      # directory is easy to add to the repository and forget here — which
      # produces a package that imports fine and then fails at the first tool
      # call. Checking the source tree would not catch that.
      - name: Packed npm tarball serves both datasets
        run: |
          npm pack --silent >/dev/null
          mkdir -p /tmp/pkg
          tar xzf ./*.tgz -C /tmp/pkg --strip-components=1
          echo "packaged data files:"
          find /tmp/pkg/src -name '*.yaml' -o -name 'RELEASE' -o -name 'COMMIT' \
            | sed 's|/tmp/pkg/|  |' | sort
          uv venv --python 3.12 /tmp/venv
          uv pip install --python /tmp/venv/bin/python --quiet "mcp>=2.3.0,<3" "pyyaml>=6"
          PYTHONPATH=/tmp/pkg/src /tmp/venv/bin/python - <<'PY'
          from mitre_atlas_mcp.tools.reference import get_atlas_info, get_mitigation
          info = get_atlas_info()
          assert info["techniques"] == 221, info
          assert info["cosai_risk_map"]["controls"] == 29, info["cosai_risk_map"]
          enriched = get_mitigation("AML.M0028")["cosai_controls"]
          assert enriched and enriched[0]["owners"], enriched
          print(f"tarball serves ATLAS {info['atlas_release']} and the CoSAI Risk Map")
          PY
