name: Release to npm

# Publishes to npm on a version tag.
#
# Credential: trusted publishing (OIDC) when a matching Trusted Publisher entry
# exists under the package's settings on npmjs.com, otherwise an NPM_TOKEN
# repository secret. Either works; the run reports which one it used.
#
# To release:
#   git tag v0.1.1 && git push origin v0.1.1
# Or run it manually from the Actions tab, which verifies the current release
# without republishing it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets Actions mint the OIDC token npm exchanges

jobs:
  release:
    runs-on: ubuntu-latest # trusted publishing does not support self-hosted runners

    # Declared at job level as well as workflow level: a workflow-level block
    # alone has been seen to grant only contents and metadata.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Report the available publish credential
        id: creds
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret is set; publishing with it."
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "No NPM_TOKEN; will attempt trusted publishing (OIDC)."
            echo "This needs a Trusted Publisher entry on npmjs.com naming"
            echo "  owner=${GITHUB_REPOSITORY%%/*} repo=${GITHUB_REPOSITORY#*/} workflow=release.yml"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither NPM_TOKEN nor an OIDC token is available; publish will fail."
          fi

      # setup-node writes an .npmrc holding
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # and defaults NODE_AUTH_TOKEN to the placeholder XXXXX-XXXXX-XXXXX-XXXXX.
      # With a real token that line is what authenticates the publish, so it
      # must stay. Without one it has to go, or npm sends the placeholder
      # instead of running the OIDC exchange and the registry answers 404.
      - name: Remove the placeholder credential when using OIDC
        if: steps.creds.outputs.has_token == 'false'
        run: |
          RC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$RC" ]; then
            sed -i '/_authToken/d' "$RC"
            echo "stripped the placeholder; npm will use OIDC"
          fi

      - run: uv sync --all-extras --dev

      - name: Check run.js parses
        run: node --check run.js

      # The version lives in src/mitre_atlas_mcp/__init__.py and is propagated
      # to package.json and server.json, so this delegates to the script that
      # owns that rather than re-implementing the comparison.
      - name: Check the manifests agree on one version
        run: uv run python scripts/sync_version.py --check

      # Guards against tagging v0.1.1 while the source still says 0.1.0.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG."
            exit 1
          fi

      - run: uv run pytest -q

      # Already-published is a normal state, not an error: re-running a tag, or
      # publishing by hand and pushing the tag afterwards, both land here. The
      # verification still runs, so a manual dispatch checks the live release.
      - name: Is this version already on npm?
        id: published
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$PKG is already on npm; publish will be skipped."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$PKG is unpublished."
          fi

      # Verify the packed tarball, not the source tree. files[] enumerates the
      # vendored datasets explicitly, so a new data directory is easy to add to
      # the repository and forget there, producing a package that imports fine
      # and then fails at the first tool call.
      - name: Packed tarball serves both datasets
        run: |
          npm pack --silent >/dev/null
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          tar xzf ./*.tgz -C /tmp/pkg --strip-components=1
          echo "packaged data files:"
          find /tmp/pkg/src -name '*.yaml' -o -name 'RELEASE' -o -name 'COMMIT' \
            | sed 's|/tmp/pkg/|  |' | sort
          uv venv --python 3.12 /tmp/verify
          uv pip install --python /tmp/verify/bin/python --quiet "mcp>=2.3.0,<3" "pyyaml>=6"
          PYTHONPATH=/tmp/pkg/src /tmp/verify/bin/python - <<'PY'
          import asyncio
          from mitre_atlas_mcp.server import mcp
          from mitre_atlas_mcp.tools.reference import get_atlas_info, get_mitigation
          tools = asyncio.run(mcp.list_tools())
          assert tools, "no tools registered"
          missing = [t.name for t in tools if not (t.description or "").strip()]
          assert not missing, f"tools without descriptions: {missing}"
          info = get_atlas_info()
          assert info["techniques"] == 221, info
          assert info["cosai_risk_map"]["controls"] == 37, info["cosai_risk_map"]
          enriched = get_mitigation("AML.M0004")["cosai_controls"]
          assert enriched and enriched[0]["owners"], enriched
          print(f"{len(tools)} tools, ATLAS {info['atlas_release']}, CoSAI enrichment present")
          PY
          rm -f ./*.tgz

      # --dry-run still queries the registry and errors on an existing version,
      # so it is skipped alongside the real publish.
      - name: Show what would be published
        if: steps.published.outputs.already == 'false'
        run: npm publish --dry-run --access public

      - name: Publish
        if: steps.published.outputs.already == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --loglevel verbose

      - name: Confirm
        if: steps.published.outputs.already == 'false'
        run: |
          NAME=$(node -p "require('./package.json').name")
          PKG=$(node -p "require('./package.json').version")
          sleep 10
          echo "npm now reports: $(npm view "$NAME" version)"
          echo "Published \`$NAME@$PKG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Already released
        if: steps.published.outputs.already == 'true'
        run: |
          NAME=$(node -p "require('./package.json').name")
          PKG=$(node -p "require('./package.json').version")
          {
            echo "### Verified, nothing to publish"
            echo
            echo "\`$NAME@$PKG\` is already on npm, so every check ran against"
            echo "the released artifact and the publish step was skipped."
          } >> "$GITHUB_STEP_SUMMARY"
